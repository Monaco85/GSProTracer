name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # fuer das Release cam-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Fester Signaturschluessel aus den Repo-Secrets: nur so lassen sich Updates ueber die
      # installierte App installieren. Der Schluessel liegt NICHT im (oeffentlichen) Repository.
      - name: Signaturschluessel bereitstellen
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.TRACER_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.TRACER_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PW" ]; then
            KS="$RUNNER_TEMP/tracer.p12"
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "TRACER_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "TRACER_KEYSTORE_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
            echo "TRACER_KEY_ALIAS=tracer" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secrets TRACER_KEYSTORE_BASE64/TRACER_KEYSTORE_PASSWORD fehlen - APK nur mit Debug-Schluessel, kein Release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK bauen
        run: gradle --no-daemon assembleRelease

      - name: APK benennen
        run: cp app/build/outputs/apk/release/app-release.apk "gsprotracer-cam-v${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GSProTracerCam-v${{ github.run_number }}
          path: android/gsprotracer-cam-v${{ github.run_number }}.apk

      # Neuester Build als Release "cam-latest" -> Update-Knopf in der App holt ihn von dort.
      - name: Release cam-latest veroeffentlichen
        if: steps.key.outputs.signed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cam-latest --cleanup-tag --yes || true
          gh release create cam-latest "gsprotracer-cam-v${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --prerelease \
            --title "GSPro Tracer Cam, neuester Build" \
            --notes "Build ${{ github.run_number }}, Commit ${{ github.sha }}"
